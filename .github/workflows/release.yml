# Релиз: git tag v2.1.0 && git push origin v2.1.0 → сборка под все системы и опубликованный релиз со всеми файлами.
# Описание берётся из раздела «## [2.1.0]» в CHANGELOG.md. Тег с дефисом (v2.1.0-beta.1) — пре-релиз.
# Пробная сборка без публикации: Actions → Release → Run workflow.
#
# Секреты репозитория (Settings → Secrets and variables → Actions) для подписи APK:
#   ANDROID_KEYSTORE_BASE64  — base64 от keystore/ebis.jks
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Версия для пробной сборки (без публикации), например 2.1.0"
        required: true

permissions:
  contents: write

env:
  # v2.1.0-beta.1 → VERSION=2.1.0-beta.1 (Android, имена файлов), NUM=2.1.0 (пакеты Windows/Linux понимают только цифры).
  RAW_VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Версия
        run: echo "VERSION=${RAW_VERSION#v}" >> "$GITHUB_ENV"
      - name: Ключ подписи
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo "::error::Нет секрета ANDROID_KEYSTORE_BASE64 — APK без своего ключа не встанет поверх прежней версии"
              exit 1
            fi
            echo "::warning::Нет ключа — APK подписан отладочным ключом"
            exit 0
          fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/ebis.jks"
          echo "EBIS_KEYSTORE=$RUNNER_TEMP/ebis.jks" >> "$GITHUB_ENV"
      - name: Сборка
        env:
          EBIS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          EBIS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          EBIS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease -PappVersion="$VERSION" --console=plain
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/ebis-ono-konem-$VERSION.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*

  windows:
    name: Windows (установщик и portable)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Версия
        shell: bash
        run: |
          V="${RAW_VERSION#v}"
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "NUM=${V%%-*}" >> "$GITHUB_ENV"
      - name: Сборка
        shell: bash
        run: ./gradlew :desktop:createDistributable -PappVersion="$NUM" --console=plain
      - name: Установщик и portable
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          New-Item -ItemType Directory -Force out | Out-Null
          & $iscc /Q "/DAppVersion=$env:NUM" "/DOutputDir=$PWD\out" packaging\windows\ebis.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:NUM -ne $env:VERSION) {
            Rename-Item "out\EbisOnoKonem-$env:NUM-windows-x64-setup.exe" "EbisOnoKonem-$env:VERSION-windows-x64-setup.exe"
          }
          Compress-Archive -Path desktop\build\compose\binaries\main\app\EbisOnoKonem -DestinationPath "out\EbisOnoKonem-$env:VERSION-windows-x64-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  linux:
    name: Linux (AppImage, deb, rpm, tar.gz, jar)
    # Старее glibc — AppImage запустится на большем числе дистрибутивов.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Версия
        run: |
          V="${RAW_VERSION#v}"
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "NUM=${V%%-*}" >> "$GITHUB_ENV"
      - name: Инструменты
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
      - name: Сборка
        run: |
          chmod +x gradlew packaging/linux/*.sh
          ./gradlew :desktop:createDistributable :desktop:packageRpm :desktop:packageUberJarForCurrentOS -PappVersion="$NUM" --console=plain
      - name: Пакеты
        run: |
          mkdir -p out
          packaging/linux/make-packages.sh out
          APPIMAGETOOL="$RUNNER_TEMP/appimagetool" packaging/linux/make-appimage.sh out
          cp "$(ls -t desktop/build/compose/binaries/main/rpm/*.rpm | head -n 1)" "out/ebis-ono-konem-$NUM.x86_64.rpm"
          cp "$(ls -t desktop/build/compose/jars/*.jar | head -n 1)" "out/ebis-ono-konem-$NUM-universal.jar"
          # В именах файлов — полная версия (с -beta.1), внутри пакетов — только цифры.
          if [ "$NUM" != "$VERSION" ]; then
            for f in out/*; do mv "$f" "${f//$NUM/$VERSION}"; done
          fi
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/*

  release:
    name: Публикация
    needs: [android, windows, linux]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Описание релиза
        run: |
          V="${GITHUB_REF_NAME#v}"
          (cd files && sha256sum * > SHA256SUMS.txt)
          # Раздел CHANGELOG.md для этой версии: от «## [V]» до следующего «## [».
          awk -v v="[$V]" 'index($0, "## " v) == 1 {on=1; next} on && /^## \[/ {exit} on {print}' CHANGELOG.md > changes.md
          [ -s changes.md ] || echo "- Подробности — в истории коммитов." > changes.md
          R="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          {
            echo "## Что нового"
            cat changes.md
            echo
            echo "## Скачать"
            echo
            echo "| Система | Файл |"
            echo "|---|---|"
            echo "| 📱 **Android** 8.0+ | [ebis-ono-konem-$V.apk]($R/ebis-ono-konem-$V.apk) |"
            echo "| 🪟 **Windows** 10/11 — установщик | [EbisOnoKonem-$V-windows-x64-setup.exe]($R/EbisOnoKonem-$V-windows-x64-setup.exe) |"
            echo "| 🪟 Windows — без установки | [EbisOnoKonem-$V-windows-x64-portable.zip]($R/EbisOnoKonem-$V-windows-x64-portable.zip) |"
            echo "| 🐧 **Linux** — любой дистрибутив | [EbisOnoKonem-$V-linux-x86_64.AppImage]($R/EbisOnoKonem-$V-linux-x86_64.AppImage) |"
            echo "| 🐧 Ubuntu / Debian / Mint | [ebis-ono-konem_${V}_amd64.deb]($R/ebis-ono-konem_${V}_amd64.deb) |"
            echo "| 🐧 Fedora / openSUSE | [ebis-ono-konem-$V.x86_64.rpm]($R/ebis-ono-konem-$V.x86_64.rpm) |"
            echo "| 🐧 Linux без root | [ebis-ono-konem-$V-linux-x64.tar.gz]($R/ebis-ono-konem-$V-linux-x64.tar.gz) |"
            echo "| ☕ Любая ОС с Java 17+ | [ebis-ono-konem-$V-universal.jar]($R/ebis-ono-konem-$V-universal.jar) |"
            echo
            echo "Контрольные суммы — в \`SHA256SUMS.txt\`. Как ставить — в [README](https://github.com/$GITHUB_REPOSITORY#скачать)."
          } > notes.md
          cat notes.md
      - name: Релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""
          case "$GITHUB_REF_NAME" in *-*) PRE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" files/* --title "Ебись оно конём $GITHUB_REF_NAME" --notes-file notes.md $PRE
